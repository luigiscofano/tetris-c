name: Verificacao C
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  posix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        cc: [gcc, clang]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: make test CC=${{ matrix.cc }}
      - run: make sanitize CC=${{ matrix.cc }}
        if: runner.os == 'Linux'
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-python make
      - shell: msys2 {0}
        run: make test CC=gcc
  evidencias:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - run: make test > testes.txt 2>&1
      - run: make demo > demo.txt
      - run: python3 scripts/gerar_preview.py && git diff --exit-code -- assets/preview.svg
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: resultados-e-demo
          path: |
            testes.txt
            demo.txt
            assets/preview.svg
